{% extends 'base.html' %}{% block title %}Horloge API{% endblock %}{% block content %}<section class="panel clock-panel"><div class="eyebrow">API JSON · EUROPE/PARIS</div><h1>Horloge en direct</h1><div class="clock" id="heure" aria-live="off">--:--:--</div><p id="message">Connexion à l'API…</p><p class="note">L'heure se met à jour sans recharger la page.</p><a class="button" href="/api/heure">Voir la réponse JSON →</a></section><script>async function mettreAJour(){try{const reponse=await fetch('/api/heure',{cache:'no-store'});if(!reponse.ok)throw Error('HTTP '+reponse.status);const donnees=await reponse.json();document.getElementById('heure').textContent=donnees.heure;document.getElementById('message').textContent=donnees.message+' · '+donnees.date;}catch(e){document.getElementById('message').textContent='Erreur de connexion à l’API.';}}mettreAJour();setInterval(mettreAJour,1000);</script>{% endblock %}
