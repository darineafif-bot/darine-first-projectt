{% extends 'base.html' %}{% block title %}Formulaire{% endblock %}{% block content %}<section class="panel"><div class="eyebrow">EXERCICE GET / POST</div><h1>Faisons connaissance</h1><p>Deux méthodes pour transmettre les mêmes informations.</p><form id="contact-form" action="/salut" method="post"><label>Votre prénom <input name="prenom" type="text" required placeholder="Darine"></label><label>Votre ville <input name="ville" type="text" required placeholder="Paris"></label><label>Votre couleur préférée <select name="couleur"><option value="tomato">Rouge</option><option value="teal">Vert</option><option value="royalblue">Bleu</option></select></label><label>Méthode HTTP <select id="method-select"><option value="post">POST (dans le corps)</option><option value="get">GET (dans l'URL)</option></select></label><button type="submit">Envoyer →</button></form><script>document.getElementById('method-select').addEventListener('change',e=>document.getElementById('contact-form').method=e.target.value);</script></section>{% endblock %}
