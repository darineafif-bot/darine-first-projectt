{% extends 'base.html' %}{% block title %}Calculatrice{% endblock %}{% block content %}<section class="panel"><div class="eyebrow">PARAMÈTRES D'URL</div><h1>Calculatrice</h1><form action="/calcul" method="get"><label>Nombre A <input type="number" name="a" value="{{ a if a is defined else 3 }}" required></label><label>Opération <select name="op"><option value="plus" {% if op == 'plus' %}selected{% endif %}>Addition</option><option value="moins" {% if op == 'moins' %}selected{% endif %}>Soustraction</option><option value="fois" {% if op == 'fois' %}selected{% endif %}>Multiplication</option></select></label><label>Nombre B <input type="number" name="b" value="{{ b if b is defined else 4 }}" required></label><button>Calculer</button></form>{% if erreur %}<p class="error">{{ erreur }}</p>{% elif resultat is defined %}<div class="result">{{ a }} {{ symbole }} {{ b }} = <strong>{{ resultat }}</strong></div>{% endif %}</section>{% endblock %}
